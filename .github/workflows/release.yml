name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate
        run: ./scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/real-estate-exec-brief.zip \
            --title "Real Estate Exec Brief $GITHUB_REF_NAME" \
            --notes "Upload real-estate-exec-brief.zip in Claude under Settings > Capabilities > Skills. See CHANGELOG.md for changes."
