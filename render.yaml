# One-click deploy of the paid connector on Render (Deploy to Render button in README).
# Paid plan required for the persistent disk that holds accounts, credits, and payments.
services:
  - type: web
    name: lagos-brief-connector
    runtime: docker
    dockerfilePath: ./connector/Dockerfile
    dockerContext: ./connector
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    # Deploy only after GitHub checks pass; doc-only edits do not restart the payment service.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - connector/**
      ignoredPaths:
        - connector/**/*.md
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # TRUST_PROXY (proxy hops in front of the app) defaults to 3 on Render and is deliberately not
      # set here: a value set in this file would overwrite a dashboard correction on every Blueprint sync.
      # Run the proxy check in connector/GO-LIVE.md (Step 3, item 8) and add TRUST_PROXY in the
      # dashboard only if the check says to.
      - key: DATABASE_PATH
        value: /data/connector.db
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
