# One-click deploy of the paid connector on Render (Deploy to Render button in README).
# Paid plan required for the persistent disk that holds accounts, credits, and payments.
services:
  - type: web
    name: lagos-brief-connector
    runtime: docker
    dockerfilePath: ./connector/Dockerfile
    dockerContext: ./connector
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    # Deploy only after GitHub checks pass; doc-only edits do not restart the payment service.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - connector/**
      ignoredPaths:
        - connector/**/*.md
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Proxy hops in front of the app (reported as 3 on Render: Cloudflare, load balancer, router).
      # Check the "proxy_check" log line after the first visit and adjust if client_ip is not the visitor's IP.
      - key: TRUST_PROXY
        value: "3"
      - key: DATABASE_PATH
        value: /data/connector.db
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
